services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: anamnese
      POSTGRES_PASSWORD: anamnese_dev
      POSTGRES_DB: anamnese
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anamnese"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
